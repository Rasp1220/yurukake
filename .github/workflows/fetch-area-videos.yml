name: Fetch area videos

on:
  schedule:
    # 毎日08:30 UTC（日本時間 17:30）に実行。YouTube APIの1日クォータは
    # 太平洋時間0:00（日本時間16:00〜17:00、夏時間/冬時間で変動）にリセット
    # されるため、その直後に自動実行することで、日中の手動実行などで
    # クォータを使い切ってしまう前に自動実行分を確保する。
    - cron: "30 8 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Call fetch-area-videos endpoint
        env:
          # 手動実行（Run workflow）のときだけ force=true を付ける。
          # 47都道府県すべて取得済みだと、force無し（毎日の自動実行）は
          # YouTubeを呼ばず即終了するので、手動実行だけが実際に更新できる。
          FORCE_PARAM: ${{ github.event_name == 'workflow_dispatch' && '?force=true' || '' }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/fetch-area-videos${FORCE_PARAM}")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
