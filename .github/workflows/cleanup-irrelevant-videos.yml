name: Cleanup irrelevant videos

# 保存済みの area_videos を点検し、「お出かけ・観光スポットと無関係」な行
# （いたずら動画・日常vlogなどが都道府県名・ジャンル語に緩くマッチして
# 紛れ込んだもの）を消す。都道府県が合っているかどうかは問わない。
# YouTube APIは呼ばないのでクォータを消費しない。手動実行のみ。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "実際に削除する（false なら点検のみで何も消さない）"
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup-irrelevant-videos endpoint
        env:
          APPLY_PARAM: ${{ inputs.apply && '?apply=true' || '' }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/cleanup-irrelevant-videos${APPLY_PARAM}")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
